{% extends 'blog/base.html' %}

{% block content %}
    <div class="container-fluid ">
        <div class="row">
            <div class="col-lg-8">
              <h1 class="mb-4">{{post_details.title}}</h1>
              <p class="text-muted">Posted on {{post_details.created_at}}</p>
              <img src="{{post_details.formatted_url}}" class="img-fluid mb-4" alt="Blog Image">
              <p>{{post_details.content}}</p>
            </div>
            <div class="col-lg-4">
              <div class="card mt-3">
                <div class="card-body">
                  <h5 class="card-title">Related Posts</h5>
                  <ul class="list-unstyled">
                    {% for related_post in related_posts %}
                    <li><a href="{% url 'detail' slug=related_post.slug %}">{{related_post.title}}</a></li>
                    {% endfor %}
                  </ul>
                </div>
              </div>
            </div>
        </div>
    </div>
{% endblock %}
